name: Release

# Builds, signs, notarizes and publishes the Mac app to a GitHub Release when a version tag is
# pushed. Requires repository secrets (none of them ever appear in logs):
#   CSC_LINK, CSC_KEY_PASSWORD       Developer ID Application certificate (.p12, base64) and its password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarization
# Without them the build fails instead of shipping an ad hoc signed app.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm typecheck && pnpm test
        env:
          CENTCOM_VAULT: ${{ runner.temp }}/centcom-vault
          CENTCOM_CONFIG_DIR: ${{ runner.temp }}/centcom-config
      - name: Write the notarization key
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Build, sign, notarize, publish
        run: pnpm release:mac --publish always
        env:
          CENTCOM_REQUIRE_DEVELOPER_ID: '1'
          CENTCOM_RELEASE_OWNER: ${{ github.repository_owner }}
          CENTCOM_RELEASE_REPO: ${{ github.event.repository.name }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums
        run: cd release && shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"
