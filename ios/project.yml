name: CENTCOM
options:
  bundleIdPrefix: studio.extendedmind
# Signing identity lives outside the repo: Base.xcconfig optionally includes the git-ignored
# Signing.xcconfig (copy Signing.xcconfig.example). Without it the app still builds for the simulator.
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 22
targets:
  CENTCOM:
    type: application
    platform: iOS
    sources:
      - path: CENTCOM
        excludes: [Resources]
      - path: CENTCOM/Resources/Markdown
        type: folder
        buildPhase: resources
      - path: CENTCOM/Resources/Demo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CENTCOM_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CENTCOM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your CENTCOM backend on your private network.
        # Only standard HTTPS (exempt): no export compliance questions on every TestFlight upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: CENTCOM/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Shown in Settings → About when set (Base.xcconfig, or a fork's Signing.xcconfig).
        CENTCOMPrivacyURL: $(CENTCOM_PRIVACY_URL)
        CENTCOMSupportURL: $(CENTCOM_SUPPORT_URL)
  CENTCOMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CENTCOMTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CENTCOM
  CENTCOMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CENTCOMUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CENTCOM
schemes:
  CENTCOM:
    build:
      targets:
        CENTCOM: all
    test:
      targets: [CENTCOMTests]
  CENTCOMUIReview:
    build:
      targets:
        CENTCOM: all
        CENTCOMUITests: [test]
    test:
      targets: [CENTCOMUITests]
